name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Gradle
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BestMart-APK
          path: app/build/outputs/apk/debug/*.apk
